<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Synthwave Shooter: The Final Cut</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: white;
            font-family: 'Press Start 2P', cursive;
            overflow: hidden;
            touch-action: none; /* 모바일 스크롤 방지 */
        }

        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
            max-width: 1000px;
            max-height: 750px;
            box-shadow: 0 0 50px rgba(255, 0, 255, 0.3);
            background: #000;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* CRT Scanline Overlay */
        #scanline {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            background-size: 100% 4px, 6px 100%;
            pointer-events: none;
            z-index: 20;
        }

        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 30;
        }

        .hud {
            position: absolute;
            top: 20px;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 30px;
            box-sizing: border-box;
            font-size: 14px;
            color: #0ff;
            text-shadow: 2px 2px #f0f;
        }

        .hud-right {
            text-align: right;
        }

        .screen {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.9);
            padding: 40px;
            border: 4px solid #f0f;
            box-shadow: 0 0 30px #f0f, inset 0 0 30px #f0f;
            text-align: center;
            display: none;
            pointer-events: auto; /* 버튼 클릭 가능 */
        }

        h1 {
            font-size: 30px;
            line-height: 1.5;
            margin-bottom: 20px;
            background: linear-gradient(to right, #0ff, #f0f);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 10px rgba(255,255,255,0.5);
        }

        .btn {
            background: transparent;
            border: 2px solid #0ff;
            color: #0ff;
            padding: 15px 30px;
            font-family: 'Press Start 2P', cursive;
            font-size: 16px;
            cursor: pointer;
            margin-top: 20px;
            box-shadow: 0 0 10px #0ff;
            transition: 0.2s;
        }
        .btn:hover {
            background: #0ff;
            color: #000;
        }

        #mobile-controls {
            display: none; /* JS로 모바일일 때만 표시 */
            position: absolute;
            bottom: 20px;
            width: 100%;
            height: 150px;
            z-index: 40;
            pointer-events: none;
        }
        .touch-area {
            position: absolute;
            bottom: 20px;
            width: 120px;
            height: 120px;
            border: 2px solid rgba(0, 255, 255, 0.3);
            border-radius: 50%;
            pointer-events: auto;
        }
        #stick-base { left: 40px; }
        #fire-btn { 
            right: 40px; 
            background: rgba(255, 0, 255, 0.2); 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            color: rgba(255,255,255,0.5);
            font-size: 12px;
        }
        #stick-knob {
            width: 50px;
            height: 50px;
            background: rgba(0, 255, 255, 0.5);
            border-radius: 50%;
            position: absolute;
            top: 35px;
            left: 35px;
        }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas" width="800" height="600"></canvas>
    <div id="scanline"></div>

    <div id="ui-layer">
        <div class="hud">
            <div class="hud-left">
                <div id="score-display">SCORE: 0</div>
                <div id="level-display">LVL: 1</div>
            </div>
            <div class="hud-right">
                <div id="highscore-display">HI: 0</div>
                <div id="shield-display">SHIELD: OFF</div>
            </div>
        </div>

        <!-- Start Screen -->
        <div id="start-screen" class="screen" style="display: block;">
            <h1>SYNTHWAVE<br>SHOOTER</h1>
            <p style="color:#aaa; font-size:10px; margin-bottom: 20px;">THE FINAL CUT</p>
            <p>ARROWS / TOUCH to Move</p>
            <p>SPACE / TAP to Shoot</p>
            <p>P to Pause</p>
            <button class="btn" onclick="game.init()">START MISSION</button>
        </div>

        <!-- Pause Screen -->
        <div id="pause-screen" class="screen">
            <h1>PAUSED</h1>
            <button class="btn" onclick="game.togglePause()">RESUME</button>
        </div>

        <!-- Game Over Screen -->
        <div id="game-over-screen" class="screen">
            <h1 style="color: #f00; -webkit-text-fill-color: #f00;">MISSION FAILED</h1>
            <p id="final-score" style="margin: 20px 0;">SCORE: 0</p>
            <button class="btn" onclick="game.restart()">RETRY</button>
        </div>
    </div>

    <!-- Mobile Controls -->
    <div id="mobile-controls">
        <div id="stick-base" class="touch-area">
            <div id="stick-knob"></div>
        </div>
        <div id="fire-btn" class="touch-area">FIRE</div>
    </div>
</div>

<script>
    /** @type {HTMLCanvasElement} */
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    // UI Elements
    const ui = {
        start: document.getElementById('start-screen'),
        pause: document.getElementById('pause-screen'),
        gameOver: document.getElementById('game-over-screen'),
        score: document.getElementById('score-display'),
        level: document.getElementById('level-display'),
        highScore: document.getElementById('highscore-display'),
        shield: document.getElementById('shield-display'),
        finalScore: document.getElementById('final-score'),
        mobile: document.getElementById('mobile-controls'),
        stick: document.getElementById('stick-knob'),
        stickBase: document.getElementById('stick-base'),
        fireBtn: document.getElementById('fire-btn')
    };

    // --- Audio System (External File + SFX Generator) ---
    const audio = {
        ctx: null,
        bgm: new Audio('music2.mp3'),
        isPlaying: false,
        
        init: function() {
            if (!this.ctx) {
                this.ctx = new (window.AudioContext || window.webkitAudioContext)();
            }
            this.bgm.loop = true;
        },

        playTone: function(freq, type, duration, vol=0.1) {
            if (!this.ctx) return;
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
            gain.gain.setValueAtTime(vol, this.ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + duration);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start();
            osc.stop(this.ctx.currentTime + duration);
        },

        playLaser: function() { 
            if (!this.ctx) return;
            const t = this.ctx.currentTime;
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.frequency.setValueAtTime(800, t);
            osc.frequency.exponentialRampToValueAtTime(100, t + 0.2);
            gain.gain.setValueAtTime(0.1, t);
            gain.gain.exponentialRampToValueAtTime(0.01, t + 0.2);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start();
            osc.stop(t + 0.2);
        },

        playExplosion: function() {
            if (!this.ctx) return;
            const bufferSize = this.ctx.sampleRate * 0.5;
            const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
            
            const noise = this.ctx.createBufferSource();
            noise.buffer = buffer;
            const filter = this.ctx.createBiquadFilter();
            filter.type = 'lowpass';
            filter.frequency.value = 1000;
            const gain = this.ctx.createGain();
            gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.5);
            
            noise.connect(filter);
            filter.connect(gain);
            gain.connect(this.ctx.destination);
            noise.start();
        },

        playPowerUp: function() {
            this.playTone(600, 'square', 0.4, 0.1);
            setTimeout(() => this.playTone(900, 'square', 0.4, 0.1), 100);
        },

        startBGM: function() {
            this.bgm.play().catch(e => console.log("BGM Play Error:", e));
            this.isPlaying = true;
        },

        stopBGM: function() {
            this.bgm.pause();
            this.isPlaying = false;
        }
    };

    // --- Game Logic ---
    const game = {
        state: 'START', // START, PLAY, PAUSE, GAMEOVER
        frame: 0,
        score: 0,
        level: 1,
        highScore: localStorage.getItem('synthCutHi') || 0,
        width: 800,
        height: 600,
        
        // Entities
        player: null,
        enemies: [],
        lasers: [],
        eLasers: [],
        particles: [],
        items: [],
        boss: null,
        stars: [],
        
        // Settings
        scrollSpeed: 2,
        shake: 0,
        glitch: 0,

        // Input
        keys: { ArrowUp:false, ArrowDown:false, ArrowLeft:false, ArrowRight:false, Space:false },
        touch: { active: false, x: 0, y: 0, shooting: false },

        setup: function() {
            ui.highScore.innerText = 'HI: ' + this.highScore;
            
            // Resize handler
            window.addEventListener('resize', () => this.resize());
            this.resize();

            // Keyboard Events
            window.addEventListener('keydown', e => {
                if (e.code === 'KeyP' || e.code === 'Escape') this.togglePause();
                if (this.keys.hasOwnProperty(e.code) || e.code === 'Space') this.keys[e.code] = true;
            });
            window.addEventListener('keyup', e => {
                if (this.keys.hasOwnProperty(e.code) || e.code === 'Space') this.keys[e.code] = false;
            });

            // Touch Events
            const handleTouch = (e, isStart) => {
                e.preventDefault();
                const touches = e.changedTouches;
                const rect = ui.stickBase.getBoundingClientRect();
                const centerX = rect.left + rect.width/2;
                const centerY = rect.top + rect.height/2;

                for (let i=0; i<touches.length; i++) {
                    const t = touches[i];
                    // Joystick Area
                    if (t.clientX < window.innerWidth / 2) {
                        if (!isStart) { // end
                            this.touch.active = false;
                            this.touch.x = 0;
                            this.touch.y = 0;
                            ui.stick.style.transform = `translate(0px, 0px)`;
                        } else {
                            this.touch.active = true;
                            let dx = t.clientX - centerX;
                            let dy = t.clientY - centerY;
                            const dist = Math.sqrt(dx*dx + dy*dy);
                            const maxDist = 40;
                            if (dist > maxDist) {
                                dx = (dx/dist) * maxDist;
                                dy = (dy/dist) * maxDist;
                            }
                            this.touch.x = dx / maxDist;
                            this.touch.y = dy / maxDist;
                            ui.stick.style.transform = `translate(${dx}px, ${dy}px)`;
                        }
                    } 
                    // Fire Button Area
                    else {
                         this.keys.Space = isStart;
                         ui.fireBtn.style.background = isStart ? 'rgba(0,255,255,0.5)' : 'rgba(255,0,255,0.2)';
                    }
                }
            };
            
            ui.mobile.addEventListener('touchstart', e => handleTouch(e, true), {passive: false});
            ui.mobile.addEventListener('touchmove', e => handleTouch(e, true), {passive: false});
            ui.mobile.addEventListener('touchend', e => handleTouch(e, false));
            
            // Check mobile
            if ('ontouchstart' in window || navigator.maxTouchPoints) {
                ui.mobile.style.display = 'block';
            }

            // Create Stars
            for(let i=0; i<100; i++) {
                this.stars.push({
                    x: Math.random() * this.width,
                    y: Math.random() * this.height,
                    size: Math.random() * 2,
                    speed: Math.random() * 3 + 0.5
                });
            }

            this.loop();
        },

        resize: function() {
            // Keep aspect ratio
            const aspect = 800 / 600;
            let w = window.innerWidth;
            let h = window.innerHeight;
            if (w / h > aspect) w = h * aspect;
            else h = w / aspect;
            
            canvas.style.width = w + 'px';
            canvas.style.height = h + 'px';
        },

        init: function() {
            audio.init();
            audio.startBGM();
            
            this.score = 0;
            this.level = 1;
            this.frame = 0;
            this.scrollSpeed = 3;
            this.enemies = [];
            this.lasers = [];
            this.eLasers = [];
            this.particles = [];
            this.items = [];
            this.boss = null;
            this.player = new Player();
            
            ui.start.style.display = 'none';
            ui.gameOver.style.display = 'none';
            ui.score.innerText = 'SCORE: 0';
            ui.level.innerText = 'LVL: 1';
            ui.shield.innerText = 'SHIELD: OFF';
            
            this.state = 'PLAY';
        },

        restart: function() {
            this.init();
        },

        togglePause: function() {
            if (this.state === 'PLAY') {
                this.state = 'PAUSE';
                audio.stopBGM();
                ui.pause.style.display = 'block';
            } else if (this.state === 'PAUSE') {
                this.state = 'PLAY';
                audio.startBGM();
                ui.pause.style.display = 'none';
            }
        },

        gameOver: function() {
            this.state = 'GAMEOVER';
            audio.stopBGM();
            audio.playExplosion();
            
            if (this.score > this.highScore) {
                this.highScore = this.score;
                localStorage.setItem('synthCutHi', this.highScore);
                ui.highScore.innerText = 'HI: ' + this.highScore;
            }
            ui.finalScore.innerText = 'SCORE: ' + this.score;
            ui.gameOver.style.display = 'block';
        },

        loop: function() {
            requestAnimationFrame(() => this.loop());
            if (this.state !== 'PLAY') return;

            // Clear
            ctx.fillStyle = '#050510';
            ctx.fillRect(0, 0, this.width, this.height);

            // Screen Shake
            ctx.save();
            if (this.shake > 0) {
                const mag = this.shake;
                ctx.translate((Math.random()-0.5)*mag, (Math.random()-0.5)*mag);
                this.shake *= 0.9;
                if(this.shake < 0.5) this.shake = 0;
            }

            // Draw Background
            this.drawStars();
            this.drawGrid();
            this.drawTerrain();

            // Updates
            this.player.update();
            this.player.draw();

            // Spawners
            this.handleSpawns();

            // Entity Loops
            [this.lasers, this.eLasers, this.enemies, this.items, this.particles].forEach(arr => {
                arr.forEach(e => { e.update(); e.draw(); });
            });
            if (this.boss) { this.boss.update(); this.boss.draw(); }

            // Collisions
            this.checkCollisions();

            // Cleanup
            this.lasers = this.lasers.filter(e => !e.dead);
            this.eLasers = this.eLasers.filter(e => !e.dead);
            this.enemies = this.enemies.filter(e => !e.dead);
            this.items = this.items.filter(e => !e.dead);
            this.particles = this.particles.filter(e => !e.dead);

            // Difficulty Scaling
            if (this.score > this.level * 2000) {
                this.level++;
                this.scrollSpeed += 0.2;
                ui.level.innerText = 'LVL: ' + this.level;
                this.glitch = 20;
                audio.playPowerUp();
            }

            // Glitch Effect
            if (this.glitch > 0) {
                this.drawGlitch();
                this.glitch--;
            }

            ctx.restore();
            this.frame++;
        },

        handleSpawns: function() {
            // Items
            if (this.frame % 1000 === 0) {
                this.items.push(new Item(Math.random() > 0.5 ? 'SPREAD' : 'SHIELD'));
            }

            // Boss
            if (!this.boss && this.level > 1 && this.score % 5000 > 4500) {
                this.boss = new Boss();
            }

            // Enemies
            if (!this.boss) {
                let rate = Math.max(30, 100 - (this.level * 5));
                if (this.frame % rate === 0) {
                    const r = Math.random();
                    if (r < 0.2 && this.level > 2) this.enemies.push(new Enemy('TANK'));
                    else if (r < 0.5) this.enemies.push(new Enemy('KAMIKAZE'));
                    else if (r < 0.7) this.enemies.push(new Enemy('SINE'));
                    else this.enemies.push(new Enemy('DRONE'));
                }
            }
        },

        checkCollisions: function() {
            // Laser vs Enemy
            this.lasers.forEach(l => {
                this.enemies.forEach(e => {
                    if (this.hit(l, e)) {
                        l.dead = true;
                        e.hp--;
                        this.createParticles(l.x, l.y, '#fff', 3);
                        if (e.hp <= 0) {
                            e.dead = true;
                            this.score += e.score;
                            ui.score.innerText = 'SCORE: ' + this.score;
                            this.createParticles(e.x, e.y, e.color, 10);
                            audio.playExplosion();
                            this.shake = 5;
                        }
                    }
                });
                if (this.boss && this.hit(l, this.boss)) {
                    l.dead = true;
                    this.boss.hp--;
                    this.createParticles(l.x, l.y, '#fff', 2);
                    if (this.boss.hp <= 0) {
                        this.score += 2000;
                        this.boss = null;
                        this.shake = 30;
                        this.createParticles(l.x, l.y, '#ff0', 50);
                        audio.playExplosion();
                    }
                }
            });

            // Player vs Anything
            const pBox = { x: this.player.x, y: this.player.y, w: this.player.w, h: this.player.h };
            
            // Vs Enemy Projectiles
            this.eLasers.forEach(el => {
                if (this.hit(pBox, el)) {
                    el.dead = true;
                    this.playerHit();
                }
            });

            // Vs Enemies
            this.enemies.forEach(e => {
                if (this.hit(pBox, e)) {
                    e.dead = true;
                    this.playerHit();
                }
            });

            // Vs Boss
            if (this.boss && this.hit(pBox, this.boss)) {
                this.playerHit();
            }

            // Vs Items
            this.items.forEach(i => {
                if (this.hit(pBox, i)) {
                    i.dead = true;
                    if (i.type === 'SPREAD') this.player.weaponLevel = 2;
                    if (i.type === 'SHIELD') {
                        this.player.shield = true;
                        ui.shield.innerText = 'SHIELD: ON';
                        ui.shield.style.color = '#0f0';
                    }
                    audio.playPowerUp();
                }
            });
        },

        playerHit: function() {
            if (this.player.invincible > 0) return;
            
            if (this.player.shield) {
                this.player.shield = false;
                ui.shield.innerText = 'SHIELD: OFF';
                ui.shield.style.color = '#0ff';
                this.player.invincible = 60;
                this.shake = 10;
                audio.playExplosion();
            } else {
                this.gameOver();
            }
        },

        hit: function(a, b) {
            // Simple AABB
            const ax = a.x - (a.w||a.r||0)/2;
            const ay = a.y - (a.h||a.r||0)/2;
            const bx = b.x - (b.w||b.r||0)/2;
            const by = b.y - (b.h||b.r||0)/2;
            return ax < bx + (b.w||b.r*2) &&
                   ax + (a.w||a.r*2) > bx &&
                   ay < by + (b.h||b.r*2) &&
                   ay + (a.h||a.r*2) > by;
        },

        createParticles: function(x, y, color, count) {
            for(let i=0; i<count; i++) this.particles.push(new Particle(x, y, color));
        },

        drawStars: function() {
            ctx.fillStyle = '#fff';
            this.stars.forEach(s => {
                s.x -= s.speed * (this.scrollSpeed/3);
                if (s.x < 0) s.x = this.width;
                ctx.globalAlpha = Math.random() * 0.5 + 0.3;
                ctx.fillRect(s.x, s.y, s.size, s.size);
            });
            ctx.globalAlpha = 1;
        },

        drawGrid: function() {
            ctx.strokeStyle = 'rgba(255, 0, 255, 0.2)';
            ctx.lineWidth = 1;
            const sz = 60;
            const off = (this.frame * this.scrollSpeed) % sz;
            
            ctx.beginPath();
            // Vertical
            for (let x = -off; x < this.width; x += sz) {
                ctx.moveTo(x, this.height/2);
                ctx.lineTo(x - (x-this.width/2)*2, this.height); // Fake perspective
            }
            // Horizontal
            for (let y = this.height/2; y < this.height; y += 20) {
                 ctx.moveTo(0, y);
                 ctx.lineTo(this.width, y);
            }
            ctx.stroke();

            // Sun
            const sunGrad = ctx.createLinearGradient(0, 0, 0, this.height/2);
            sunGrad.addColorStop(0, '#ff0');
            sunGrad.addColorStop(1, '#f0f');
            ctx.fillStyle = sunGrad;
            ctx.beginPath();
            ctx.arc(this.width/2, this.height/2, 100, Math.PI, 0);
            ctx.fill();
        },

        drawTerrain: function() {
            ctx.fillStyle = '#000';
            ctx.beginPath();
            ctx.moveTo(0, this.height);
            for(let x=0; x<=this.width; x+=10) {
                const h = Math.sin((x + this.frame * this.scrollSpeed) * 0.01) * 30 + 50;
                ctx.lineTo(x, this.height - h);
            }
            ctx.lineTo(this.width, this.height);
            ctx.fill();
            
            ctx.strokeStyle = '#0ff';
            ctx.shadowBlur = 10;
            ctx.shadowColor = '#0ff';
            ctx.stroke();
            ctx.shadowBlur = 0;
        },
        
        drawGlitch: function() {
             const h = this.height / 10;
             for(let i=0; i<10; i++) {
                 if (Math.random() > 0.5) {
                     ctx.drawImage(canvas, 
                        0, i*h, this.width, h,
                        (Math.random()-0.5)*20, i*h, this.width, h);
                 }
             }
        }
    };

    // --- Classes ---
    class Player {
        constructor() {
            this.x = 100;
            this.y = 300;
            this.w = 40;
            this.h = 30;
            this.speed = 6;
            this.cooldown = 0;
            this.weaponLevel = 1; // 1: Single, 2: Spread
            this.shield = false;
            this.invincible = 0;
        }
        update() {
            // Movement
            let dx = 0, dy = 0;
            if (game.keys.ArrowUp) dy = -1;
            if (game.keys.ArrowDown) dy = 1;
            if (game.keys.ArrowLeft) dx = -1;
            if (game.keys.ArrowRight) dx = 1;
            
            if (game.touch.active) {
                dx = game.touch.x;
                dy = game.touch.y;
            }

            this.x += dx * this.speed;
            this.y += dy * this.speed;

            // Bounds
            this.x = Math.max(0, Math.min(game.width - this.w, this.x));
            this.y = Math.max(30, Math.min(game.height - this.h, this.y));

            // Shoot
            if (this.cooldown > 0) this.cooldown--;
            if (game.keys.Space && this.cooldown <= 0) {
                this.shoot();
            }
            
            if (this.invincible > 0) this.invincible--;
        }
        shoot() {
            audio.playLaser();
            this.cooldown = 10;
            if (this.weaponLevel === 1) {
                game.lasers.push(new Laser(this.x + this.w, this.y, 0));
            } else {
                game.lasers.push(new Laser(this.x + this.w, this.y, 0));
                game.lasers.push(new Laser(this.x + this.w, this.y, 2));
                game.lasers.push(new Laser(this.x + this.w, this.y, -2));
            }
        }
        draw() {
            if (this.invincible > 0 && Math.floor(game.frame/4)%2===0) return;
            
            ctx.save();
            ctx.shadowBlur = 15;
            ctx.shadowColor = this.shield ? '#0f0' : '#f0f';
            ctx.strokeStyle = this.shield ? '#0f0' : '#f0f';
            ctx.lineWidth = 2;
            
            // Wireframe Ship
            ctx.beginPath();
            ctx.moveTo(this.x + this.w, this.y);
            ctx.lineTo(this.x, this.y - this.h/2);
            ctx.lineTo(this.x + 10, this.y);
            ctx.lineTo(this.x, this.y + this.h/2);
            ctx.closePath();
            ctx.stroke();
            
            // Engine
            ctx.fillStyle = '#0ff';
            ctx.globalAlpha = 0.6;
            ctx.beginPath();
            ctx.moveTo(this.x, this.y - 5);
            ctx.lineTo(this.x - 20 - Math.random()*10, this.y);
            ctx.lineTo(this.x, this.y + 5);
            ctx.fill();
            
            ctx.restore();
        }
    }

    class Laser {
        constructor(x, y, vy) {
            this.x = x;
            this.y = y;
            this.vy = vy;
            this.w = 30;
            this.h = 4;
            this.speed = 15;
            this.dead = false;
        }
        update() {
            this.x += this.speed;
            this.y += this.vy;
            if (this.x > game.width) this.dead = true;
        }
        draw() {
            ctx.shadowBlur = 10;
            ctx.shadowColor = '#0ff';
            ctx.fillStyle = '#0ff';
            ctx.fillRect(this.x, this.y - 2, this.w, 4);
            ctx.shadowBlur = 0;
        }
    }

    class Enemy {
        constructor(type) {
            this.type = type;
            this.x = game.width + 50;
            this.y = Math.random() * (game.height - 100) + 50;
            this.dead = false;
            this.timer = 0;
            
            if (type === 'DRONE') {
                this.hp = 1; this.w=30; this.h=30; this.speed = 4; this.color = '#f00'; this.score = 100;
            } else if (type === 'TANK') {
                this.hp = 5; this.w=50; this.h=50; this.speed = 2; this.color = '#f80'; this.score = 300;
            } else if (type === 'KAMIKAZE') {
                this.hp = 1; this.w=20; this.h=20; this.speed = 8; this.color = '#ff0'; this.score = 150;
            } else if (type === 'SINE') {
                this.hp = 2; this.w=30; this.h=30; this.speed = 3; this.color = '#f0f'; this.score = 200;
                this.startY = this.y;
            }
        }
        update() {
            this.x -= this.speed;
            this.timer++;

            if (this.type === 'SINE') {
                this.y = this.startY + Math.sin(this.timer * 0.05) * 80;
            }
            if (this.type === 'KAMIKAZE') {
                // Home in on player slightly
                if (game.player.y > this.y) this.y += 1;
                else this.y -= 1;
            }
            // Shoot
            if (this.type !== 'KAMIKAZE' && Math.random() < 0.01) {
                game.eLasers.push(new Projectile(this.x, this.y, -5, 0));
            }

            if (this.x < -100) this.dead = true;
        }
        draw() {
            ctx.save();
            ctx.translate(this.x, this.y);
            ctx.strokeStyle = this.color;
            ctx.shadowColor = this.color;
            ctx.shadowBlur = 10;
            ctx.lineWidth = 2;
            
            ctx.beginPath();
            if (this.type === 'TANK') ctx.strokeRect(-25, -25, 50, 50);
            else if (this.type === 'DRONE') { ctx.moveTo(-15, -15); ctx.lineTo(15, 0); ctx.lineTo(-15, 15); ctx.closePath(); ctx.stroke(); }
            else ctx.arc(0, 0, this.w/2, 0, Math.PI*2);
            ctx.stroke();
            ctx.restore();
        }
    }

    class Boss {
        constructor() {
            this.x = game.width + 100;
            this.y = game.height / 2;
            this.w = 100;
            this.h = 100;
            this.hp = 50 + (game.level * 10);
            this.maxHp = this.hp;
            this.dir = 1;
            this.timer = 0;
            this.dead = false;
        }
        update() {
            if (this.x > game.width - 150) this.x -= 2;
            this.y += this.dir * 2;
            if (this.y > game.height - 100 || this.y < 100) this.dir *= -1;
            
            this.timer++;
            if (this.timer % 60 === 0) {
                // Spiral Shot
                for(let i=0; i<8; i++) {
                    const angle = (Math.PI * 2 / 8) * i + this.timer;
                    game.eLasers.push(new Projectile(this.x, this.y, Math.cos(angle)*4, Math.sin(angle)*4));
                }
            }
        }
        draw() {
            ctx.save();
            ctx.shadowBlur = 20;
            ctx.shadowColor = '#ff0';
            ctx.strokeStyle = '#ff0';
            ctx.lineWidth = 3;
            ctx.strokeRect(this.x - 50, this.y - 50, 100, 100);
            
            // Skull Face
            ctx.fillStyle = '#000';
            ctx.fillRect(this.x - 30, this.y - 30, 20, 20); // Eye
            ctx.fillRect(this.x + 10, this.y - 30, 20, 20); // Eye
            ctx.fillRect(this.x - 20, this.y + 20, 40, 10); // Mouth
            
            // HP Bar
            ctx.fillStyle = '#f00';
            ctx.fillRect(this.x - 50, this.y - 80, 100, 10);
            ctx.fillStyle = '#0f0';
            ctx.fillRect(this.x - 50, this.y - 80, 100 * (this.hp / this.maxHp), 10);
            
            ctx.restore();
        }
    }

    class Projectile {
        constructor(x, y, vx, vy) {
            this.x = x; this.y = y; this.vx = vx; this.vy = vy;
            this.w = 10; this.h = 10; this.dead = false;
        }
        update() {
            this.x += this.vx; this.y += this.vy;
            if (this.x < 0 || this.x > game.width || this.y < 0 || this.y > game.height) this.dead = true;
        }
        draw() {
            ctx.fillStyle = '#ff0';
            ctx.shadowBlur = 5;
            ctx.shadowColor = '#ff0';
            ctx.beginPath();
            ctx.arc(this.x, this.y, 5, 0, Math.PI*2);
            ctx.fill();
        }
    }

    class Item {
        constructor(type) {
            this.type = type;
            this.x = game.width;
            this.y = Math.random() * (game.height - 100) + 50;
            this.w = 30; this.h = 30;
            this.dead = false;
        }
        update() {
            this.x -= 3;
            if (this.x < -50) this.dead = true;
        }
        draw() {
            ctx.save();
            ctx.translate(this.x, this.y);
            ctx.fillStyle = '#0f0';
            ctx.shadowBlur = 10;
            ctx.shadowColor = '#0f0';
            ctx.font = '20px sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.strokeStyle = '#0f0';
            ctx.strokeRect(-15, -15, 30, 30);
            ctx.fillText(this.type === 'SPREAD' ? 'S' : 'P', 0, 0);
            ctx.restore();
        }
    }

    class Particle {
        constructor(x, y, color) {
            this.x = x; this.y = y; this.color = color;
            this.life = 1; 
            this.vx = (Math.random()-0.5)*10; 
            this.vy = (Math.random()-0.5)*10;
            this.dead = false;
        }
        update() {
            this.x += this.vx; this.y += this.vy;
            this.life -= 0.05;
            if (this.life <= 0) this.dead = true;
        }
        draw() {
            ctx.globalAlpha = this.life;
            ctx.fillStyle = this.color;
            ctx.fillRect(this.x, this.y, 4, 4);
            ctx.globalAlpha = 1;
        }
    }

    // Initial Setup
    game.setup();

</script>
</body>
</html>
